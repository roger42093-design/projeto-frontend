# Configuração do nginx dentro do container do front (copiada pelo Dockerfile).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Rotas do React (/meus-chamados, /oauth2/redirect, /webmail...):
    # se não existir um arquivo com esse nome, devolve o index.html e o React Router resolve.
    # Sem isto, o retorno do login com Google e qualquer F5 dariam 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos do build (nome muda a cada versão): podem ficar em cache por bastante tempo
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Service worker das notificações: sempre buscar a versão nova
    location = /firebase-messaging-sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # index.html sem cache, para o navegador pegar a versão nova depois de um deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}